<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Upcoming paper submission deadlines for AI, ML, NLP, HCI, and data-science conferences relevant to HAIR Lab, Yonsei University.">
  <title>Deadlines | HAIR Lab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-header">
    <div class="container">
      <h1>Deadlines</h1>
      <p>Upcoming submission deadlines for conferences relevant to our research</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="dl-bar">
        <div class="dl-meta" id="dl-meta"></div>
        <div class="dl-legend">
          <span class="dl-legend-item"><span class="dl-dot dl-dot-urgent"></span>Due ≤ 14 days</span>
          <span class="dl-legend-item"><span class="dl-dot dl-dot-open"></span>Open</span>
          <span class="dl-legend-item"><span class="dl-dot dl-dot-past"></span>Passed</span>
          <span class="dl-legend-item dl-legend-note">Estimates for planning — verify on the official site.</span>
        </div>
      </div>

      <div class="dl-filter" id="dl-filter">
        <span class="dl-filter-label">Filter</span>
      </div>

      <div class="dl-table" id="dl-table">
        <div class="loading">Loading deadlines…</div>
      </div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/deadlines.js"></script>
</body>
</html>
